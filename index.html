<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Maria Garcia Santiago</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <h1>MARÍA SANTISIMA</h1>
  </header>

  <main>
    <section class="destacada">
      <img src="images/obra1.JPG" alt="Imagen destacada del artista">
      <p class="texto-destacada">Imagen destacada</p>
    </section>

    <section class="galeria">
      <div class="grid-galeria">
        <figure>
          <img src="images/obra2.JPG" alt="Obra 2">
          <figcaption>Obra 2</figcaption>
        </figure>

        <figure>
          <img src="images/obra3.JPG" alt="Obra 3">
          <figcaption>Obra 3</figcaption>
        </figure>

        <figure>
          <img src="images/obra4.JPG" alt="Obra 4">
          <figcaption>Obra 4</figcaption>
        </figure>

        <figure>
          <img src="images/obra5.JPG" alt="Obra 5">
          <figcaption>Obra 5</figcaption>
        </figure>

        <figure>
          <img src="images/obra6.JPG" alt="Obra 6">
          <figcaption>Obra 6</figcaption>
        </figure>

        <figure>
          <img src="images/obra7.JPG" alt="Obra 7">
          <figcaption>Obra 7</figcaption>
        </figure>

        <figure>
          <img src="images/obra8.JPG" alt="Obra 8">
          <figcaption>Obra 8</figcaption>
        </figure>

        <figure>
          <img src="images/obra9.JPG" alt="Obra 9">
          <figcaption>Obra 9</figcaption>
        </figure>

        <figure>
          <img src="images/obra10.JPG" alt="Obra 10">
          <figcaption>Obra 10</figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
